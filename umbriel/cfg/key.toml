[keybinds]

# Applications
"Mod+Return" = "spawn ghostty"
"Mod+B" = "spawn floorp"
"Mod+E" = "spawn thunar"
"Alt+Z" = "spawn gsr-ui"

# Noctalia
"Mod" = "spawn noctalia msg panel-toggle launcher"
"Alt+Tab" = "spawn noctalia msg window-switcher hold"
"Mod+Comma" = "spawn noctalia msg settings-toggle"

# Screenshots
"Print" = "spawn noctalia msg screenshot-region"
"Ctrl+Print" = "spawn noctalia msg screenshot-fullscreen"
"Alt+Print" = "spawn noctalia msg screenshot-annotate"

# Audio
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }

# Brightness
"XF86MonBrightnessUp" = { action = "spawn brightnessctl --class=backlight set +10%", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl --class=backlight set 10%-", allow_when_locked = true }

# Workspace Switching
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+U" = "workspace-previous"
"Mod+I" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"

# Move Windows Between Workspaces
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Ctrl+U" = "window-move-to-workspace-previous"
"Mod+Ctrl+I" = "window-move-to-workspace-next"
"Mod+Ctrl+Up" = "window-move-to-workspace-previous"
"Mod+Ctrl+Down" = "window-move-to-workspace-next"

# Window Focus
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+Home" = "window-focus-previous"
"Mod+End" = "window-focus-next"

# Window Actions
"Mod+Q" = "window-close"
"Mod+Alt+Space" = "window-toggle-floating"
"Mod+Ctrl+F" = "window-toggle-floating"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+F" = "window-toggle-maximize"
"Mod+M"= "window-toggle-maximize-to-edges"
"Mod+C" = "window-center"
"Mod+R" = "workspace-set-layout toggle"
"Mod+Minus" = "window-modify-primary-extent -0.05"
"Mod+Equal" = "window-modify-primary-extent 0.05"
"Mod+Tab" = { action = "overview-toggle", repeat = false }

# Move Windows Between Outputs
"Mod+Ctrl+Shift+H" = "column-move-to-output-left"
"Mod+Ctrl+Shift+Left" = "column-move-to-output-left"
"Mod+Ctrl+Shift+L" = "column-move-to-output-right"
"Mod+Ctrl+Shift+Right" = "column-move-to-output-right"
