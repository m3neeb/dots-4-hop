[appearance]
prefer_no_csd = true
border_width = 2
#outer_border_width = 0
corner_radius = 0
drag_opacity = 1.00

[appearance.blur]
enabled = true
optimized = false
passes = 3
radius = 3
noise = 0
saturation = 1.0
brightness = 0.9
contrast = 1

[appearance.shadow]
enabled = false
softness = 30
offset_x = 0
offset_y = 0

[appearance.title_bar]
mode = "on"
height = 26
font = "Iosevka Nerd Font 11"
button_position = "right"
#buttons = ["maximize", "close"]
button_corner_radius = 0
